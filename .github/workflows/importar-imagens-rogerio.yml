name: Importar imagens recebidas do Rogério
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  importar:
    if: github.event.head_commit.message == 'ci: importar imagens recebidas do Rogério'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Importar os arquivos enviados
        env:
          FOTO_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F6e46aaa0-78ec-496a-be1e-b49659f4cb90/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEBGG3ydHZgLBXo9tKdNcmnzuDgVf_HVek7VOUTP3HkE&exp=1793325728&osig=AAAAAAAAAAAAAAAAAAAAADI3oHbhvat1FB8HHz1fh_mBlm9ub6RPo3j7A0-iFStV&signer=media-rpc&token=AAIAAU0AJDZlNDZhYWEwLTc4ZWMtNDk2YS1iZTFlLWI0OTY1OWY0Y2I5MAAAAAABoYqLAQBdctkM0S4N47GLbR5YsMC2NABueCCHhnewGuEmFq1E2Q&x-canva-quality=thumbnail"
          LOGO_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:134/quality:100/uri:ifs%3A%2F%2FM%2F07fcff57-4417-4d07-86d0-3ba84555505b/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHXOm89bFfrXPqEeXWfyqxTe2oAUtkJuos9DrDVZJk8U&exp=1793323116&osig=AAAAAAAAAAAAAAAAAAAAAF8PbyH9TO9hRfKE8Nz_6yrapB12ImY4S-Zf16WMTTfo&signer=media-rpc&token=AAIAAU0AJDA3ZmNmZjU3LTQ0MTctNGQwNy04NmQwLTNiYTg0NTU1NTA1YgAAAAABoYpjJeAU2P4b1uDRGOxhDeGXS7XZXRfRs5IK11-qi-HYu34xeQ&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p public/img
          curl --retry 3 -fLsS "$FOTO_URL" -o public/img/rogerio-retrato.jpg
          curl --retry 3 -fLsS "$LOGO_URL" -o public/img/rogerio-logo.png
          test "$(wc -c < public/img/rogerio-retrato.jpg)" -gt 1000
          test "$(wc -c < public/img/rogerio-logo.png)" -gt 1000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/rogerio-retrato.jpg public/img/rogerio-logo.png
          git commit -m "Adiciona retrato e logo oficial enviados pelo cliente"
          git push
